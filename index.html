<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#65001b"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><title>Overtime - Late Train</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f3f4;color:#29242a;font:16px/1.45 system-ui,sans-serif}header{background:linear-gradient(135deg,#4d0016,#810027);color:#fff;padding:18px;border-bottom:5px solid #ed0751}.head{max-width:700px;margin:auto;display:flex;align-items:center;gap:14px}.logo{width:78px;height:78px;border-radius:15px;object-fit:cover}.brand{font-size:clamp(23px,5vw,32px);font-weight:850;line-height:1.05}main{max-width:700px;margin:18px auto;padding:0 14px}.card{background:#fff;border-radius:16px;padding:20px;border:1px solid #e7dfe3}.notice{padding:12px;background:#fff5df;border-left:4px solid #e6b52f;border-radius:8px;font-size:13px;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px;min-width:0}.full{grid-column:auto}label{font-weight:750;font-size:14px}input,select,textarea{font:inherit;width:100%;min-height:47px;padding:11px;border:1px solid #cfc5cb;border-radius:10px;background:white}.hint{font-size:12px;color:#706870}.result{margin-top:17px;padding:14px;background:#fbf0f4;border:1px solid #efd5df;border-radius:11px}.result b{display:block;color:#65001b;font-size:13px}.time{font-size:27px;font-weight:850;color:#65001b}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.btn{padding:13px;border-radius:10px;font-weight:750;border:1px solid #e2c5d0;min-height:47px}.primary{background:#65001b;color:white;border-color:#65001b}.secondary{background:#faeaf0;color:#65001b}.reset{width:100%;margin-top:10px;background:white}.status{text-align:center;font-size:12px;color:#706870;margin-top:12px;min-height:18px}@media(max-width:700px){
 body{font-size:15px;line-height:1.35;overflow-x:hidden}
 header{padding:10px 12px;border-bottom-width:3px}
 .head{gap:10px}
 .logo{width:48px;height:48px;border-radius:10px}
 .brand{font-size:clamp(19px,5.5vw,25px);line-height:1.02}
 main{width:100%;margin:8px auto;padding:0 8px}
 .card{padding:11px;border-radius:12px}
 .notice{padding:8px 9px;font-size:12px;margin-bottom:11px}
 .grid{grid-template-columns:minmax(0,1fr);gap:10px}
 .field{gap:4px}
 .full{grid-column:auto}
 label{font-size:12px;line-height:1.25}
 input,select,textarea{font-size:16px;min-height:42px;padding:8px;border-radius:8px;min-width:0}
 textarea{min-height:58px;resize:vertical}
 .hint{font-size:11px;line-height:1.25}
 .result{margin-top:11px;padding:9px}
 .result b{font-size:12px}
 .time{font-size:24px}
 .actions{grid-template-columns:minmax(0,1fr);gap:8px;margin-top:11px}
 .btn{font-size:14px;padding:10px 6px;min-height:43px;border-radius:8px;white-space:normal}
 .reset{margin-top:7px}
 .status{margin-top:8px;font-size:11px;min-height:15px}
}
@media(max-width:350px){.grid{gap:8px}.card{padding:9px}.btn{font-size:13px}.logo{width:42px;height:42px}}

</style></head><body><header><div class="head"><img class="logo" src="icon-192.png" alt="App icon"><div class="brand">OVERTIME -<br>LATE TRAIN</div></div></header><main><section class="card"><div class="notice">⚠️ <b>12-hour rest rule</b> Confirm the 12-hour rule and other rostering rules are not compromised before submitting.</div><form id="f"><div class="grid">
<div class="field"><label for="date">Date</label><input id="date" type="date" required></div>
<div class="field"><label for="head">Headcode</label><input id="head" placeholder="1E63" maxlength="4" pattern="[0-9][A-Za-z][0-9]{2}" title="Enter a headcode such as 1E63" required></div>
<div class="field"><label for="delay">Delay in minutes</label><input id="delay" type="text" inputmode="numeric" pattern="[0-9]{1,3}" maxlength="3" placeholder="15" required><span class="hint">Numbers only · maximum 3 digits.</span></div>
<div class="field"><label for="original">Original book-off time</label><input id="original" type="time" required></div>
<div class="field full"><label for="reason">Operational reason for delay</label><select id="reason" required><option value="">Select a reason…</option><option>Following late running services</option>
<option>Train fault</option>
<option>Late running / service disruption</option>
<option>Signal failure</option>
<option>Points failure</option>
<option>Track / infrastructure issue</option>
<option>Congestion / preceding service</option>
<option>Platform alteration / platform congestion</option>
<option>Train crew availability / late relief</option>
<option>Staffing / operational issue</option>
<option>Train crew change / handover delay</option>
<option>Door fault</option>
<option>Rolling stock fault</option>
<option>Train operating restrictions</option>
<option>Speed restriction</option>
<option>Signalling / route setting delay</option>
<option>Overhead line / power supply issue</option>
<option>Track circuit / signalling equipment failure</option>
<option>Failed train / assisting another service</option>
<option>Train dispatch delay</option>
<option>Passenger incident</option>
<option>Security alert/incident</option>
<option>Emergency services incident</option>
<option>Trespass / person on the line</option>
<option>Level crossing incident</option>
<option>Obstruction on the line</option>
<option>Animal on the line</option>
<option>Medical emergency</option>
<option>Police incident</option>
<option>Weather disruption</option>
<option>Flooding / adverse weather</option>
<option>Infrastructure maintenance / possession impact</option>
<option>Route diversion / operational regulation</option>
<option>Missed connection / connection held</option>
<option>Other</option></select></div>
<div class="field full"><label for="notes">Additional information / notes (optional)</label><textarea id="notes" rows="2" placeholder="Add details to explain the delay, if needed…"></textarea><span class="hint">This text is added to the email only when provided, without an extra heading.</span></div>
</div>
<div class="result"><b>New book-off time</b><div class="time" id="newtime">—</div></div>
<div class="actions"><button class="btn primary" type="button" id="email">✉ Generate Email</button><button class="btn secondary" type="button" id="copy">▣ Copy Text</button></div><button class="btn reset" type="reset">Reset form</button><div id="status" class="status">Entries save on this device.</div></form></section></main>
<script>
const $=id=>document.getElementById(id),ids=['date','head','delay','original','reason','notes'],key='overtime-late-train-form-v1',pad=n=>String(n).padStart(2,'0');let customReason='';
function today(){let d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function calc(){let t=$('original').value,d=$('delay').value;if(!t||!/^[0-9]{1,3}$/.test(d)){$('newtime').textContent='—';return ''}let [h,m]=t.split(':').map(Number),v=(h*60+m+Number(d))%1440,r=pad(Math.floor(v/60))+':'+pad(v%60);$('newtime').textContent=r;return r}
function showOther(){if($('reason').value==='Other'){const answer=prompt('Enter a custom reason for the delay:',customReason);if(answer===null||!answer.trim()){$('reason').value='';customReason='';$('status').textContent='Custom reason cancelled. Select a reason to continue.';save();return}customReason=answer.trim()}else{customReason=''}save()}
function save(){try{localStorage.setItem(key,JSON.stringify({...Object.fromEntries(ids.map(i=>[i,$(i).value])),customReason}))}catch(e){}}
function data(){return {date:$('date').value,head:$('head').value.trim().toUpperCase(),delay:$('delay').value,reason:$('reason').value==='Other'?customReason:$('reason').value,notes:$('notes').value.trim(),time:calc()}}
function valid(){if(!$('f').reportValidity())return false;let x=data();if(!/^[0-9][A-Z][0-9]{2}$/.test(x.head)){ $('head').setCustomValidity('Enter a headcode such as 1E63.');$('head').reportValidity();$('head').setCustomValidity('');return false}return !!x.time}
function subj(x){return 'Late Book Off Request: '+x.head+' ['+x.delay+' MINS late] '+x.date.split('-').reverse().join('/')+' - New Book off time '+x.time}
function body(x){return 'Hello Train Crew Resources.\n\nDue to the the late running of '+x.head+'\n\nplease book me off duty late, this train is was '+x.delay+' minutes late and the delay was due to a '+x.reason+(x.notes?'\n\n'+x.notes:'')+'\n\nplease book me off duty at '+x.time+' due to the above delay.\nI can confirm that the “12 hour rule” or any other rostering rules have not been compromised and my next turn of duty is unaffected.\n\nThanks'}
function report(x){return 'Subject: '+subj(x)+'\\n\\n'+body(x)}
ids.forEach(i=>$(i).addEventListener('input',()=>{if(i==='delay')$(i).value=$(i).value.replace(/\\D/g,'').slice(0,3);if(i==='reason')showOther();calc();save()}));
$('email').onclick=()=>{if(!valid())return;let x=data();save();location.href='mailto:?subject='+encodeURIComponent(subj(x))+'&body='+encodeURIComponent(body(x));$('status').textContent='Email draft opened. The delay minutes are emphasised in the report wording.'};
$('copy').onclick=async()=>{if(!valid())return;let x=data(),txt=report(x);save();try{await navigator.clipboard.writeText(txt);$('status').textContent='Text copied to clipboard.'}catch(e){let t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();$('status').textContent='Text copied.'}};
$('f').addEventListener('reset',()=>setTimeout(()=>{localStorage.removeItem(key);customReason='';$('date').value=today();calc();$('status').textContent='Form reset.'},0));
try{let d=JSON.parse(localStorage.getItem(key)||'{}');ids.forEach(i=>{if(d[i]!==undefined)$(i).value=d[i]});customReason=d.customReason||d.other||''}catch(e){}if(!$('date').value)$('date').value=today();calc();
// Service worker is disabled in this standalone preview.
</script></body></html>
